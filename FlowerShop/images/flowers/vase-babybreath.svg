  <rect x="246" y="442" width="108" height="22" rx="11" fill="#64748b"/>
  <path d="M300 453 L265 505 L286 512 Z" fill="#64748b"/>
  <path d="M300 453 L335 505 L314 512 Z" fill="#64748b"/>
