    <circle cx="205" cy="285" r="46" fill="#ffffff"/>
    <circle cx="205" cy="285" r="26" fill="#dbeafe"/>
    <circle cx="395" cy="285" r="46" fill="#ffffff"/>
    <circle cx="395" cy="285" r="26" fill="#dbeafe"/>
    <circle cx="265" cy="280" r="52" fill="#dbeafe"/>
    <circle cx="265" cy="280" r="30" fill="#ffffff"/>
    <circle cx="335" cy="280" r="52" fill="#dbeafe"/>
    <circle cx="335" cy="280" r="30" fill="#ffffff"/>
    <circle cx="300" cy="238" r="62" fill="#ffffff"/>
