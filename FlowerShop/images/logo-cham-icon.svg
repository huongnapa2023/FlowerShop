<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="crestRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="petalSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
  </defs>

  <!-- Pearl Circle & Double Botanical Frame -->
  <circle cx="100" cy="100" r="93" fill="#fffafb" stroke="url(#crestRing)" stroke-width="5.5"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldAccent)" stroke-width="1.4" stroke-dasharray="3 2" opacity="0.65"/>

  <!-- Classic Serif Monogram 'C' -->
  <path d="M144 63
           C133 48, 115 42, 97 44
           C68 47, 50 70, 50 100
           C50 131, 69 154, 99 156
           C118 157, 135 149, 146 134
           L141 130
           C131 142, 117 148, 102 147
           C78 146, 64 126, 64 100
           C64 73, 79 53, 101 52
           C117 51, 130 57, 139 69 Z"
        fill="url(#crestRing)"/>
  <!-- Serif Terminal Finials on 'C' -->
  <polygon points="145,53 147,70 138,67" fill="#881337"/>

  <!-- Botanical Leaves Entwined with 'C' -->
  <g stroke="#881337" stroke-width="1.6" fill="#ffe4e6">
    <path d="M76 74 C68 58, 78 46, 90 54 C84 62, 80 68, 76 74 Z"/>
    <path d="M84 126 C94 138, 110 140, 115 129 C104 125, 94 124, 84 126 Z"/>
    <path d="M68 128 C64 142, 72 153, 82 146 C77 139, 73 134, 68 128 Z"/>
  </g>
  <path d="M77 72 L84 57 M86 127 L107 131 M69 130 L77 143" stroke="#881337" stroke-width="1.1" fill="none" opacity="0.7"/>

  <!-- Hand-Drawn Multi-Petal Peony Rose (Inspired by Sam Flora Crest) -->
  <g transform="translate(64,102)" stroke="#881337" stroke-width="1.7" stroke-linejoin="round">
    <!-- Outer Guard Petals -->
    <path d="M-24 -6 C-34 -20, -20 -36, -4 -28 C-8 -18, -15 -10, -24 -6 Z" fill="url(#petalSoft)"/>
    <path d="M-6 -28 C4 -40, 24 -34, 20 -16 C12 -20, 2 -24, -6 -28 Z" fill="#fff1f2"/>
    <path d="M18 -16 C34 -14, 36 8, 18 14 C16 4, 16 -6, 18 -16 Z" fill="url(#petalSoft)"/>
    <path d="M16 14 C22 30, 2 38, -10 26 C-2 22, 8 18, 16 14 Z" fill="#fff1f2"/>
    <path d="M-10 26 C-26 34, -36 16, -24 2 C-18 10, -14 18, -10 26 Z" fill="url(#petalSoft)"/>

    <!-- Middle Cupped Petals -->
    <circle cx="0" cy="-2" r="20" fill="#ffe4e6"/>
    <path d="M-16 -4 C-18 -18, -2 -24, 8 -16 C18 -18, 22 -2, 12 8 C16 18, 0 24, -10 14 C-22 14, -22 2, -16 -4 Z" fill="#fffafb"/>
    <path d="M-10 -3 C-10 -12, 2 -16, 9 -8 C14 -2, 8 10, -2 10 C-11 10, -14 2, -10 -3 Z" fill="#fecdd3"/>

    <!-- Peony Center Stamens -->
    <circle cx="0" cy="-1" r="5.5" fill="url(#goldAccent)" stroke="#881337" stroke-width="1.3"/>
    <circle cx="-2" cy="-3" r="1.3" fill="#fff"/>
    <circle cx="2" cy="-2" r="1.2" fill="#fff"/>
    <circle cx="0" cy="1.5" r="1.2" fill="#fff"/>
  </g>
</svg>
